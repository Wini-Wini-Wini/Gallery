<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Notion 3D Media Gallery Pro</title>
  
  <!-- Font Inter for modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --glass-bg: rgba(25, 25, 25, 0.45);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-blur: blur(35px) saturate(180%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #ffffff;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    
    body, html {
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #000; 
      font-family: var(--font-family);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* Ocultar scrollbars globalmente, mas manter funcionalidade onde necessário */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

    .bg-layer {
      position: fixed; inset: 0; z-index: 1; 
      background-color: #0f0f11; 
      transition: background-color 1s ease;
    }

    body.bg-aurora .bg-layer {
      background-color: #4c1d95;
      background-image: radial-gradient(at 0% 0%, #a78bfa 0px, transparent 50%), radial-gradient(at 100% 100%, #1e3a8a 0px, transparent 50%);
    }
    body.bg-sunset .bg-layer {
      background-color: #450a0a;
      background-image: radial-gradient(at 50% 0%, #ea580c 0px, transparent 60%), radial-gradient(at 50% 100%, #000000 0px, transparent 80%);
    }
    body.bg-ocean .bg-layer {
      background-color: #082f49;
      background-image: radial-gradient(at 20% 80%, #0d9488 0px, transparent 60%), radial-gradient(at 80% 20%, #4c1d95 0px, transparent 60%);
    }
    body.bg-forest .bg-layer {
      background-color: #064e3b;
      background-image: radial-gradient(at 10% 10%, #059669 0px, transparent 60%), radial-gradient(at 90% 90%, #022c22 0px, transparent 60%);
    }

    body.bg-adaptive .bg-layer { background-color: #050505; }
    .adaptive-slide {
      position: absolute; inset: -10%;
      background-size: cover; background-position: center;
      filter: blur(60px) saturate(150%) brightness(0.5);
      transform: scale(1.1);
      opacity: 0; transition: opacity 1.2s ease-in-out;
      pointer-events: none; will-change: opacity;
    }
    .adaptive-slide.active { opacity: 1; }

    .bg-noise {
      position: fixed; inset: 0; z-index: 2; opacity: 0.25; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    .gallery-container {
      position: relative; z-index: 10;
      width: 100vw; height: 100vh; overflow: hidden;
    }
    .slides-wrapper { position: absolute; inset: 0; width: 100vw; height: 100vh; overflow: visible; }
    
    .slide {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      perspective: 1200px; will-change: transform;
    }

    .card-3d-scene {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      transform-style: preserve-3d; will-change: transform; cursor: grab;
    }
    .card-3d-scene:active { cursor: grabbing; }

    .extrusionContainer { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }
    .extrusion-layer {
      position: absolute; inset: 0; border-radius: var(--radius-lg); 
      border: 1px solid rgba(255, 255, 255, 0.02); transform-style: preserve-3d;
    }

    .back-face {
      position: absolute; inset: 0; border-radius: var(--radius-lg);
      background: #1a1a1a; border: 1px solid rgba(255, 255, 255, 0.05);
      transform: translateZ(-15px); 
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9), 0 20px 30px -10px rgba(0, 0, 0, 0.7);
      pointer-events: none; transform-style: preserve-3d;
    }

    .glass-frame {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      padding: 12px; border-radius: var(--radius-lg);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), inset 0 0 20px rgba(0,0,0,0.5); 
      transform: translateZ(0); transform-style: preserve-3d; z-index: 10;
    }

    .glow-mask {
      position: absolute; inset: -2px; border-radius: 26px; padding: 2px; 
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none; transform: translateZ(2px); z-index: 15; overflow: hidden; opacity: 0.8;
    }
    .glow-spinner {
      position: absolute; top: -100%; left: -100%; width: 300%; height: 300%;
      background: conic-gradient(transparent 60%, rgba(255,255,255,0.5) 80%, #ffffff 100%);
      animation: spinLight 4s linear infinite; will-change: transform; 
    }
    @keyframes spinLight { 100% { transform: rotate(360deg); } }

    #galleryContainer.border-rgb .glow-spinner { background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
    #galleryContainer.border-gold .glow-spinner { background: conic-gradient(transparent 50%, #fcd34d 75%, #d97706 100%); }
    #galleryContainer.border-blood .glow-spinner { background: conic-gradient(transparent 40%, rgba(220,38,38,0.5) 70%, #991b1b 100%); }
    #galleryContainer.border-space .glow-spinner { background: conic-gradient(transparent 60%, rgba(167,139,250,0.5) 85%, #4c1d95 100%); }
    #galleryContainer.border-wave .glow-spinner { background: conic-gradient(transparent 40%, rgba(56,189,248,0.7) 70%, #0284c7 100%); }

    .media-content {
      max-width: calc(100vw - 40px); max-height: calc(80vh - 40px);
      object-fit: contain; border-radius: var(--radius-md); display: block;
      transform: translateZ(2px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      z-index: 30; pointer-events: auto; backface-visibility: hidden; 
    }

    .video-wrapper {
      position: relative; display: inline-flex; transform: translateZ(2px);
      transform-style: preserve-3d; backface-visibility: hidden;
    }
    
    .pause-overlay {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) translateZ(10px) scale(0.9);
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex; align-items: center; justify-content: center;
      color: white; opacity: 0; pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .video-paused .pause-overlay {
      opacity: 1; transform: translate(-50%, -50%) translateZ(30px) scale(1);
    }

    .video-controls {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateZ(20px);
      width: calc(100% - 32px); max-width: 400px;
      background: rgba(10, 10, 10, 0.65); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-xl); 
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; z-index: 60; opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .video-wrapper:hover .video-controls, .video-paused .video-controls {
      opacity: 1; transform: translateX(-50%) translateZ(40px);
    }
    
    .control-btn {
      background: none; border: none; color: var(--text-main); cursor: pointer; 
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, opacity 0.2s; padding: 4px; opacity: 0.8;
    }
    .control-btn:hover { opacity: 1; transform: scale(1.1); }
    
    .progress-bar-container { flex: 1; display: flex; align-items: center; height: 20px; }
    .volume-container { display: flex; align-items: center; gap: 6px; width: 80px; height: 20px;}

    .glass-slider {
      -webkit-appearance: none; width: 100%; height: 4px;
      background: rgba(255, 255, 255, 0.2); border-radius: 2px;
      outline: none; cursor: pointer; transition: height 0.2s;
    }
    .glass-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      background: #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transition: transform 0.2s; transform: scale(0.8); 
    }
    .glass-slider:hover::-webkit-slider-thumb { transform: scale(1.2); }

    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-main); cursor: pointer; opacity: 0; transition: all 0.3s; z-index: 50;
    }
    .gallery-container:hover .nav-btn { opacity: 0.4; }
    .nav-btn:hover { opacity: 1 !important; background: rgba(255, 255, 255, 0.1); transform: translateY(-50%) scale(1.05); }
    .prev-btn { left: 24px; } .next-btn { right: 24px; }
    @media (max-width: 768px) { .nav-btn { display: none; } /* Ocultar setas no mobile, usar swipe */ }

    .dots-container {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 50;
      padding: 6px 12px; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(8px); border-radius: var(--radius-xl);
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); cursor: pointer; transition: all 0.3s; }
    .dot.active { width: 20px; border-radius: 4px; background: #fff; box-shadow: 0 0 8px rgba(255, 255, 255, 0.5); }

    .top-controls {
      position: absolute; top: 24px; right: 24px; display: flex; gap: 12px; z-index: 60;
    }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); cursor: pointer; transition: all 0.2s;
    }
    .icon-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.1); }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    
    .modal-content {
      width: 90%; max-width: 420px; 
      background: rgba(20, 20, 22, 0.85); backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: var(--radius-lg);
      padding: 24px; display: flex; flex-direction: column; gap: 20px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-backdrop.open .modal-content { transform: translateY(0); }
    
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
    .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 50%; display:flex; }
    .close-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
    
    .upload-zone { 
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-md); 
      padding: 24px 20px; text-align: center; cursor: pointer; transition: all 0.2s; 
      background: rgba(255,255,255,0.02); display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .upload-zone:hover { background: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.2); }
    
    .lists-container { max-height: 240px; overflow-y: auto; padding-right: 8px; display: flex; flex-direction: column; gap: 16px; }
    .modal-list-section h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
    
    .media-list { display: flex; flex-direction: column; gap: 8px; }
    .media-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.02); padding: 8px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.03); }
    .media-thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: #111; }
    .media-info { flex: 1; font-size: 13px; color: var(--text-main); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .delete-btn { background: none; border: none; color: #ef4444; padding: 8px; cursor: pointer; opacity: 0.6; transition: all 0.2s; border-radius: 6px; display: flex;}
    .delete-btn:hover { background: rgba(239, 68, 68, 0.1); opacity: 1; }

    .custom-section h4 { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 12px; }
    .custom-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .custom-btn {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius-sm); 
      padding: 10px; color: var(--text-muted); font-size: 12px; cursor: pointer; transition: all 0.2s; text-align: center; font-family: inherit;
    }
    .custom-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-main); }
    .custom-btn.active { background: #fff; color: #000; font-weight: 500; border-color: #fff; }
    
    .empty-state {
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        color: var(--text-muted); text-align: center; font-size: 14px;
        background: rgba(0,0,0,0.4); padding: 40px; border-radius: var(--radius-lg); backdrop-filter: blur(10px); border: 1px dashed rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>

  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-noise"></div>

  <div class="gallery-container border-default" id="galleryContainer">
    
    <div class="top-controls">
      <button class="icon-btn" id="openCustomBtn" title="Aparência">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
      </button>
      <button class="icon-btn" id="openModalBtn" title="Gerenciar Mídias">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      </button>
    </div>

    <div class="nav-btn prev-btn" id="prevBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></div>
    <div class="nav-btn next-btn" id="nextBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></div>

    <div class="slides-wrapper" id="slidesWrapper"></div>
    <div class="dots-container" id="dotsContainer"></div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Galeria de Mídia</h3>
        <button class="close-btn" id="closeModalBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <div class="upload-zone" id="uploadDropzone">
        <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none;" />
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Clique ou arraste novos arquivos</p>
      </div>
      <div class="lists-container">
          <div class="modal-list-section" id="section-images" style="display: none;">
             <h4>Imagens</h4><div class="media-list" id="list-images-content"></div>
          </div>
          <div class="modal-list-section" id="section-videos" style="display: none;">
             <h4>Vídeos & GIFs</h4><div class="media-list" id="list-videos-content"></div>
          </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalCustom">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Aparência</h3>
        <button class="close-btn" id="closeCustomBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <div class="custom-section">
        <h4>Tema de Fundo</h4>
        <div class="custom-grid">
          <button class="custom-btn active" onclick="setBg('default', this)">Escuro</button>
          <button class="custom-btn" onclick="setBg('adaptive', this)">Dinâmico</button>
          <button class="custom-btn" onclick="setBg('aurora', this)">Aurora</button>
          <button class="custom-btn" onclick="setBg('sunset', this)">Pôr do Sol</button>
          <button class="custom-btn" onclick="setBg('ocean', this)">Oceano</button>
          <button class="custom-btn" onclick="setBg('forest', this)">Floresta</button>
        </div>
      </div>
      <div class="custom-section">
        <h4>Efeito da Borda</h4>
        <div class="custom-grid">
          <button class="custom-btn active" onclick="setBorder('default', this)">Branco</button>
          <button class="custom-btn" onclick="setBorder('rgb', this)">RGB</button>
          <button class="custom-btn" onclick="setBorder('gold', this)">Ouro</button>
          <button class="custom-btn" onclick="setBorder('blood', this)">Rubi</button>
          <button class="custom-btn" onclick="setBorder('space', this)">Nebulosa</button>
          <button class="custom-btn" onclick="setBorder('wave', this)">Oceânico</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DB_NAME = 'NotionSuperGalleryDB_Pro_V2';
    const DB_VERSION = 1;
    const STORE_NAME = 'media';

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          if (!e.target.result.objectStoreNames.contains(STORE_NAME)) {
            e.target.result.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function saveMediaItem(file) {
      const db = await initDB();
      const type = file.type.startsWith('video') ? 'video' : 'image';
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).add({ name: file.name, type: type, blob: file, ts: Date.now() });
        tx.oncomplete = () => resolve();
      });
    }

    async function getAllMedia() {
      const db = await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result);
      });
    }

    async function deleteMediaItem(id) {
      const db = await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    const thumbCache = {};
    
    function generateThumb(item) {
        return new Promise((resolve) => {
            const url = URL.createObjectURL(item.blob);
            if (item.type === 'image') {
                const img = new Image();
                img.src = url;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 120; // Resolução ideal para blur
                    canvas.height = 120 * (img.height / img.width);
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL());
                    URL.revokeObjectURL(url);
                }
                img.onerror = () => { resolve(''); URL.revokeObjectURL(url); };
            } else {
                const video = document.createElement('video');
                video.src = url; video.muted = true; video.playsInline = true;
                
                video.onloadedmetadata = () => { video.currentTime = Math.min(1, video.duration / 2 || 0); };
                video.onseeked = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = 120; canvas.height = 120 * (video.videoHeight / video.videoWidth);
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL());
                    } catch(e) { resolve(''); }
                    URL.revokeObjectURL(url);
                };
                video.onerror = () => { resolve(''); URL.revokeObjectURL(url); };
            }
        });
    }

    let items = [], activeURLs = [];
    const wrapper = document.getElementById('slidesWrapper');
    const dotsContainer = document.getElementById('dotsContainer');
    const bgLayer = document.getElementById('bgLayer');
    
    let virtualIndex = 0, cameraX = 0, lastActiveIndex = -1; 
    
    async function loadGallery() {
      activeURLs.forEach(u => URL.revokeObjectURL(u));
      activeURLs.length = 0;
      items = await getAllMedia();

      for (const item of items) {
          if (!thumbCache[item.id]) thumbCache[item.id] = await generateThumb(item);
      }

      if (items.length === 0) {
        virtualIndex = 0; cameraX = 0;
        wrapper.innerHTML = `
            <div class="slide">
                <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    <span>Galeria Vazia<br>Adicione mídias nas configurações.</span>
                </div>
            </div>`;
      } else {
        virtualIndex = 0; cameraX = 0;
        renderAllSlides();
      }
      renderDots(); renderManageList(); updateAdaptiveBg(0);
    }

    function build3DExtrusion(container) {
      container.innerHTML = '';
      const layersCount = 8; // Otimizado de 12 para 8 para melhor performance
      const step = 15 / layersCount; 
      for(let i = 1; i <= layersCount; i++) {
        const layer = document.createElement('div');
        layer.className = 'extrusion-layer';
        layer.style.transform = `translateZ(-${(i * step).toFixed(2)}px)`;
        const shade = Math.max(15, 35 - (i * 1.5)); 
        layer.style.background = `rgb(${shade}, ${shade}, ${shade})`;
        container.appendChild(layer);
      }
    }

    function renderAllSlides() {
      wrapper.innerHTML = '';
      items.forEach((item, idx) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        const url = URL.createObjectURL(item.blob);
        activeURLs.push(url);

        const cardHtml = `
          <div class="card-3d-scene">
            <div class="extrusionContainer"></div>
            <div class="back-face"></div>
            <div class="glass-frame">
              <div class="glow-mask"><div class="glow-spinner"></div></div>
              <div class="mediaContainer"></div>
            </div>
          </div>
        `;
        slide.innerHTML = cardHtml;
        const mediaContainer = slide.querySelector('.mediaContainer');

        if (item.type === 'video') {
          const vWrap = document.createElement('div');
          vWrap.className = 'video-wrapper';
          
          const video = document.createElement('video');
          video.src = url; video.className = 'media-content'; 
          video.loop = true; video.playsInline = true;
          
          const pauseIcon = document.createElement('div');
          pauseIcon.className = 'pause-overlay';
          pauseIcon.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
          
          const controls = document.createElement('div');
          controls.className = 'video-controls';
          controls.innerHTML = `
            <button class="control-btn play-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
            <div class="progress-bar-container"><input type="range" class="glass-slider progress-slider" min="0" max="100" value="0" /></div>
            <div class="volume-container">
              <button class="control-btn mute-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg></button>
              <input type="range" class="glass-slider volume-slider" min="0" max="1" step="0.01" value="1" />
            </div>
          `;

          vWrap.appendChild(video); vWrap.appendChild(pauseIcon); vWrap.appendChild(controls);

          const playBtn = controls.querySelector('.play-btn');
          const progressSlider = controls.querySelector('.progress-slider');
          const muteBtn = controls.querySelector('.mute-btn');
          const volumeSlider = controls.querySelector('.volume-slider');

          // Prevent drag triggering on controls
          controls.addEventListener('mousedown', e => e.stopPropagation());
          controls.addEventListener('touchstart', e => e.stopPropagation());

          const updateSliderBg = (slider, percent) => {
            slider.style.background = `linear-gradient(to right, rgba(255,255,255,0.9) ${percent}%, rgba(255,255,255,0.2) ${percent}%)`;
          };
          updateSliderBg(volumeSlider, 100);

          const togglePlay = () => {
            if (video.paused) { 
              video.play(); vWrap.classList.remove('video-paused'); 
              playBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>`;
            } else { 
              video.pause(); vWrap.classList.add('video-paused'); 
              playBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
            }
          };

          vWrap.onclick = (e) => { e.stopPropagation(); togglePlay(); };
          playBtn.onclick = (e) => { e.stopPropagation(); togglePlay(); };

          video.ontimeupdate = () => {
            if (!video.duration) return;
            const percentage = (video.currentTime / video.duration) * 100;
            progressSlider.value = percentage; updateSliderBg(progressSlider, percentage);
          };
          progressSlider.oninput = (e) => {
            if (!video.duration) return;
            video.currentTime = (e.target.value / 100) * video.duration;
            updateSliderBg(progressSlider, e.target.value);
          };

          const updateMuteIcon = () => {
            muteBtn.innerHTML = (video.muted || video.volume === 0) 
              ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>`
              : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
          };
          volumeSlider.oninput = (e) => {
            video.volume = e.target.value; video.muted = e.target.value === '0';
            updateSliderBg(volumeSlider, e.target.value * 100); updateMuteIcon();
          };
          muteBtn.onclick = (e) => {
            e.stopPropagation(); video.muted = !video.muted;
            if (!video.muted && video.volume === 0) video.volume = 1;
            volumeSlider.value = video.muted ? 0 : video.volume;
            updateSliderBg(volumeSlider, video.muted ? 0 : video.volume * 100); updateMuteIcon();
          };

          mediaContainer.appendChild(vWrap);
        } else {
          const img = document.createElement('img');
          img.src = url; img.className = 'media-content'; img.draggable = false;
          mediaContainer.appendChild(img);
        }
        wrapper.appendChild(slide);
      });

      document.querySelectorAll('.extrusionContainer').forEach(cont => build3DExtrusion(cont));
      lastActiveIndex = -1;
    }

    let adaptiveBgTimeout = null;

    function updateAdaptiveBg(idx) {
       if (!document.body.classList.contains('bg-adaptive')) return;
       if (idx < 0 || idx >= items.length) return;
       
       const thumb = thumbCache[items[idx].id];
       if (!thumb) return; 

       const newBg = document.createElement('div');
       newBg.className = 'adaptive-slide';
       newBg.style.backgroundImage = `url(${thumb})`;
       bgLayer.appendChild(newBg);
       
       void newBg.offsetWidth; // Force reflow
       newBg.classList.add('active');

       if (adaptiveBgTimeout) clearTimeout(adaptiveBgTimeout);
       adaptiveBgTimeout = setTimeout(() => {
           const slides = bgLayer.querySelectorAll('.adaptive-slide');
           slides.forEach(s => { if (s !== newBg) s.remove(); });
       }, 1200);
    }

    function updateVideoPlayback(activeIdx) {
      document.querySelectorAll('.slide').forEach((slide, i) => {
        const vid = slide.querySelector('video');
        if(vid) {
          const vWrap = slide.querySelector('.video-wrapper');
          const playBtn = slide.querySelector('.play-btn');
          if(i === activeIdx) {
            vid.play().catch(() => {});
            if(vWrap) vWrap.classList.remove('video-paused');
            if(playBtn) playBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>`;
          } else {
            vid.pause();
            if(vWrap) vWrap.classList.add('video-paused');
            if(playBtn) playBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
          }
        }
      });
    }

    function updateDotsUI(activeIdx) {
      document.querySelectorAll('.dot').forEach((dot, i) => {
          dot.classList.toggle('active', i === activeIdx);
      });
    }

    function handleIndexChange() {
      const N = items.length;
      if (N === 0) return;
      let normalizedActive = ((Math.round(virtualIndex) % N) + N) % N;
      if (normalizedActive !== lastActiveIndex) {
         lastActiveIndex = normalizedActive;
         updateVideoPlayback(normalizedActive);
         updateDotsUI(normalizedActive);
         updateAdaptiveBg(normalizedActive);
      }
    }

    function renderDots() {
      dotsContainer.innerHTML = '';
      if (items.length > 1) {
        items.forEach((_, i) => {
          const dot = document.createElement('div');
          dot.className = 'dot';
          dot.onclick = () => {
            const N = items.length;
            let currentMod = ((Math.round(cameraX) % N) + N) % N;
            let diff = i - currentMod;
            if (diff > N/2) diff -= N;
            if (diff < -N/2) diff += N;
            virtualIndex = Math.round(cameraX) + diff;
            handleIndexChange();
          };
          dotsContainer.appendChild(dot);
        });
      }
    }

    document.getElementById('prevBtn').onclick = () => { if(items.length > 1) { virtualIndex--; handleIndexChange(); } };
    document.getElementById('nextBtn').onclick = () => { if(items.length > 1) { virtualIndex++; handleIndexChange(); } };

    document.addEventListener('keydown', (e) => {
      if(items.length <= 1) return;
      if(e.key === 'ArrowRight') { virtualIndex++; handleIndexChange(); }
      if(e.key === 'ArrowLeft') { virtualIndex--; handleIndexChange(); }
    });

    const container = document.getElementById('galleryContainer');
    let targetRotX = 0, targetRotY = 0, currentRotX = 0, currentRotY = 0, targetZoom = 1, currentZoom = 1;
    let isDragging = false, startMouseX = 0, startMouseY = 0, baseRotX = 0, baseRotY = 0;
    
    // Swipe Logic for Mobile
    let touchStartX = 0, touchEndX = 0;
    
    container.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, {passive: true});
    
    container.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    }, {passive: true});

    function handleSwipe() {
        const threshold = 50;
        if (touchEndX < touchStartX - threshold) { if(items.length > 1) { virtualIndex++; handleIndexChange(); } } // Swipe left
        if (touchEndX > touchStartX + threshold) { if(items.length > 1) { virtualIndex--; handleIndexChange(); } } // Swipe right
    }

    container.addEventListener('wheel', (e) => {
      e.preventDefault(); 
      targetZoom += e.deltaY * -0.002;
      targetZoom = Math.min(Math.max(0.6, targetZoom), 2.5); 
    }, { passive: false });

    container.addEventListener('mousedown', (e) => {
      if(e.target.closest('.nav-btn, .icon-btn, .modal-backdrop, .video-controls')) return;
      isDragging = true; startMouseX = e.clientX; startMouseY = e.clientY;
      baseRotX = targetRotX; baseRotY = targetRotY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      targetRotY = baseRotY + ((e.clientX - startMouseX) * 0.2);
      targetRotX = baseRotX - ((e.clientY - startMouseY) * 0.2);
    });

    function endDrag() { if(!isDragging) return; isDragging = false; targetRotX = 0; targetRotY = 0; }
    window.addEventListener('mouseup', endDrag); window.addEventListener('mouseleave', endDrag);

    function renderPhysics() {
      currentRotX += (targetRotX - currentRotX) * 0.1;
      currentRotY += (targetRotY - currentRotY) * 0.1;
      currentZoom += (targetZoom - currentZoom) * 0.12; 
      cameraX += (virtualIndex - cameraX) * 0.08; 

      const slides = document.querySelectorAll('.slide');
      const N = slides.length;

      if (N > 0) {
        slides.forEach((slide, i) => {
          let instanceOffset = (N > 1) ? Math.round((cameraX - i) / N) * N : 0;
          let actualIndex = i + instanceOffset;
          
          let distanceFromCamera = Math.abs(actualIndex - cameraX);
          if (distanceFromCamera > 1.5 && N > 3) {
             slide.style.visibility = 'hidden'; slide.style.pointerEvents = 'none'; return; 
          }
          
          slide.style.visibility = 'visible'; slide.style.pointerEvents = 'auto';

          let spacing = 100 * Math.max(1, currentZoom); 
          let screenX = (actualIndex - cameraX) * spacing; 
          slide.style.transform = `translateX(${screenX}vw)`;
          
          const card = slide.querySelector('.card-3d-scene');
          if(card) {
              card.style.transform = `scale(${currentZoom.toFixed(3)}) rotateX(${currentRotX.toFixed(3)}deg) rotateY(${currentRotY.toFixed(3)}deg)`;
          }
        });
      }
      requestAnimationFrame(renderPhysics);
    }
    requestAnimationFrame(renderPhysics);

    const modal = document.getElementById('modalBackdrop');
    document.getElementById('openModalBtn').onclick = () => modal.classList.add('open');
    document.getElementById('closeModalBtn').onclick = () => modal.classList.remove('open');
    modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };

    const customModal = document.getElementById('modalCustom');
    document.getElementById('openCustomBtn').onclick = () => customModal.classList.add('open');
    document.getElementById('closeCustomBtn').onclick = () => customModal.classList.remove('open');
    customModal.onclick = (e) => { if (e.target === customModal) customModal.classList.remove('open'); };

    function setBg(type, btn) {
      document.body.className = ''; bgLayer.innerHTML = ''; 
      if(type !== 'default') {
         document.body.classList.add(`bg-${type}`);
         if (type === 'adaptive') updateAdaptiveBg(lastActiveIndex >= 0 ? lastActiveIndex : 0);
      }
      updateActiveBtn(btn);
    }

    function setBorder(type, btn) {
      container.classList.remove('border-rgb', 'border-gold', 'border-blood', 'border-space', 'border-wave');
      if(type !== 'default') container.classList.add(`border-${type}`);
      updateActiveBtn(btn);
    }

    function updateActiveBtn(btn) {
      btn.parentElement.querySelectorAll('.custom-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    const fileInp = document.getElementById('fileInput');
    document.getElementById('uploadDropzone').onclick = () => fileInp.click();
    fileInp.onchange = async (e) => {
      for (const f of Array.from(e.target.files)) await saveMediaItem(f);
      fileInp.value = ''; await loadGallery();
    };

    function renderManageList() {
      const listImages = document.getElementById('list-images-content');
      const listVideos = document.getElementById('list-videos-content');
      
      listImages.innerHTML = ''; listVideos.innerHTML = '';
      let hasImages = false, hasVideos = false;

      items.forEach((item) => {
        const div = document.createElement('div'); div.className = 'media-item';
        const isVideoOrGif = item.type === 'video' || item.name.toLowerCase().endsWith('.gif');
        
        const thumb = document.createElement('img');
        thumb.src = thumbCache[item.id] || ''; thumb.className = 'media-thumb';
        
        const info = document.createElement('div'); info.className = 'media-info'; info.textContent = item.name;
        
        const delBtn = document.createElement('button'); delBtn.className = 'delete-btn';
        delBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>`;
        delBtn.onclick = async () => { await deleteMediaItem(item.id); await loadGallery(); };
        
        div.append(thumb, info, delBtn); 
        if (isVideoOrGif) { listVideos.appendChild(div); hasVideos = true; } 
        else { listImages.appendChild(div); hasImages = true; }
      });

      document.getElementById('section-images').style.display = hasImages ? 'block' : 'none';
      document.getElementById('section-videos').style.display = hasVideos ? 'block' : 'none';
    }

    // Init
    loadGallery();
  </script>
</body>
</html>
